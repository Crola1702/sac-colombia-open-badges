name: Keepalive
# Supabase free projects pause after 7 days without activity. A cheap read every
# 3 days keeps the project awake.
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query achievements through the REST API
        run: |
          curl --fail-with-body -sS \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            "${{ vars.SUPABASE_URL }}/rest/v1/achievements?select=id&limit=1"
