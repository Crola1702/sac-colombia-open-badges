name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      # Both values are public (anon key is protected by RLS), so repo variables are fine.
      - name: Write web/config.js
        run: |
          cat > web/config.js <<CFG
          export const SUPABASE_URL = "${{ vars.SUPABASE_URL }}";
          export const SUPABASE_ANON_KEY = "${{ vars.SUPABASE_ANON_KEY }}";
          CFG
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
