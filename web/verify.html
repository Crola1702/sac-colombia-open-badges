<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificar insignia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Verificación de insignia</h1>
  <p id="loading" role="status">Verificando...</p>
  <div id="result" hidden>
    <p id="status" class="status" role="status"></p>
    <p id="reason" class="muted"></p>
    <img id="image" class="badge-img" alt="" hidden>
    <h2 id="name"></h2>
    <p id="description"></p>
    <p><strong>Criterios:</strong> <span id="criteria"></span></p>
    <p><strong>Otorgada a:</strong> <span id="recipient"></span></p>
    <p><strong>Emitida por:</strong> <a id="issuer"></a></p>
    <p><strong>Fecha:</strong> <span id="date"></span></p>
    <div class="row">
      <button id="download" type="button">Descargar JSON firmado</button>
      <a id="image-download" class="btn" hidden>Descargar imagen</a>
      <a id="linkedin" class="btn" target="_blank" rel="noopener">Agregar a LinkedIn</a>
    </div>
    <p class="muted">El JSON descargado es una credencial estándar Open Badges 3.0. Puede comprobarse en validadores externos de OB3, por ejemplo el validador de Open Badges de 1EdTech.</p>
  </div>
</main>
<script type="module" src="verify.js"></script>
</body>
</html>
